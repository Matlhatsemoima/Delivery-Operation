<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f5">
  <title>Mish — Delivery operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="Mish home">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 22.5 13.1 8l4.2 7.3 2.4-4.1L27 25H8.5a4 4 0 0 1-3.5-2.5Z" fill="currentColor"/><circle cx="23.5" cy="8.5" r="2.5" fill="#b9ef6a"/></svg></span>
        <span class="brand-name">Mish<span>.</span></span>
      </a>
      <div class="workspace-switch"><span class="workspace-avatar">M</span><span class="workspace-copy"><strong>Mish Logistics</strong><small>Pro workspace</small></span><span class="switch-chevron">⌄</span></div>
      <div class="nav-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="Overview"><span class="nav-icon">◫</span>Overview</button>
        <button class="nav-item" data-view="Live tracking"><span class="nav-icon">◎</span>Live tracking<span class="nav-live"></span></button>
        <button class="nav-item" data-view="Deliveries"><span class="nav-icon">▤</span>Deliveries<span class="nav-count" id="delivery-count">12</span></button>
        <button class="nav-item" data-view="Vehicles"><span class="nav-icon">▰</span>Vehicles</button>
        <button class="nav-item" data-view="Drivers"><span class="nav-icon">♙</span>Drivers</button>
      </nav>
      <div class="nav-label nav-label-spaced">OPERATIONS</div>
      <nav class="main-nav" aria-label="Operations navigation">
        <button class="nav-item" data-view="Route planning"><span class="nav-icon">⌁</span>Route planning</button>
        <button class="nav-item" data-view="Fuel"><span class="nav-icon">♧</span>Fuel</button>
        <button class="nav-item" data-view="Maintenance"><span class="nav-icon">⚙</span>Maintenance<span class="nav-dot"></span></button>
      </nav>
      <div class="nav-label nav-label-spaced">INSIGHTS</div>
      <nav class="main-nav" aria-label="Insights navigation">
        <button class="nav-item" data-view="Analytics"><span class="nav-icon">▥</span>Analytics</button>
        <button class="nav-item" data-view="Reports"><span class="nav-icon">▧</span>Reports</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">✳</div><strong>Need a hand?</strong><p>Our fleet experts are here for you.</p><button id="support-button">Visit help center <span>↗</span></button></div>
        <button class="nav-item settings-item" data-view="Settings"><span class="nav-icon">⚙</span>Settings</button>
        <div class="profile"><div class="profile-avatar">M</div><div class="profile-copy"><strong>Mish</strong><small>Fleet manager</small></div><button class="profile-more" aria-label="Profile options">···</button></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open menu">☰</button>
        <div class="breadcrumbs"><span>Workspace</span><span class="breadcrumb-slash">/</span><strong id="breadcrumb-current">Overview</strong></div>
        <div class="topbar-actions">
          <label class="search-box"><span>⌕</span><input id="global-search" type="search" placeholder="Search anything..." aria-label="Search anything"><kbd>⌘ K</kbd></label>
          <button class="icon-button notification-button" aria-label="Notifications">♧<i></i></button>
          <div class="today-label"><span class="today-dot"></span> Thursday, October 24, 2024</div>
        </div>
      </header>
      <section class="page-content" id="page-content"></section>
      <footer class="footer"><span>© 2024 Mish</span><span>Made for the miles ahead <b>✳</b></span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><div><div class="eyebrow">DELIVERY MANAGEMENT</div><h2 id="modal-title">Create a delivery</h2></div><button class="modal-close" id="modal-close" aria-label="Close dialog">×</button></div>
      <form id="delivery-form">
        <label>Customer name<input name="customer" required placeholder="e.g. Olivia Martin"></label>
        <label>Delivery address<input name="address" required placeholder="Street address, city"></label>
        <div class="form-row"><label>Assigned driver<select name="driver" required><option value="">Select a driver</option><option>Thabo Mokoena</option><option>Naledi Nkosi</option><option>Sipho Dlamini</option><option>Lerato Khumalo</option><option>Pieter van der Merwe</option><option>Zanele Ndlovu</option></select></label><label>Delivery window<input name="window" required placeholder="e.g. 2:00–4:00 PM"></label></div>
        <div class="modal-actions"><button type="button" class="button button-quiet" id="cancel-modal">Cancel</button><button type="submit" class="button button-primary">Create delivery <span>→</span></button></div>
      </form>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
